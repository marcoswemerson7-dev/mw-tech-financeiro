name: Migrate BG attachments to Drive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-bg-attachments.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Migrate Supabase attachments to Google Drive
        shell: bash
        run: |
          set -euo pipefail
          URL="https://jfzavijlkbqzkrnlgphz.supabase.co/functions/v1/migrate-supabase-attachments-to-drive"
          for i in $(seq 1 25); do
            echo "Batch $i"
            RESPONSE="$(curl --fail --silent --show-error --max-time 180 "$URL?limit=10")"
            echo "$RESPONSE"
            REMAINING="$(echo "$RESPONSE" | jq -r '.remaining // 0')"
            FAILED="$(echo "$RESPONSE" | jq -r '.failed // 0')"
            if [ "$FAILED" != "0" ]; then
              echo "Batch completed with $FAILED failure(s); continuing so transient failures can be retried."
            fi
            if [ "$REMAINING" = "0" ]; then
              echo "Migration complete."
              exit 0
            fi
            sleep 2
          done
          echo "Migration did not finish within the allowed batches."
          exit 1
