name: Cleanup migrated BG Supabase storage

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-bg-storage.yml"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete migrated originals from Supabase Storage
        shell: bash
        run: |
          set -euo pipefail
          URL="https://jfzavijlkbqzkrnlgphz.supabase.co/functions/v1/cleanup-migrated-bg-storage?confirm=delete-migrated-bg-20260918"
          for i in $(seq 1 12); do
            echo "Batch $i"
            RESPONSE="$(curl --fail --silent --show-error --max-time 180 \
              -X POST "$URL" \
              -H "Content-Type: application/json" \
              --data '{"limit":20}')"
            echo "$RESPONSE"
            REMAINING="$(echo "$RESPONSE" | jq -r '.remaining // 0')"
            FAILED="$(echo "$RESPONSE" | jq -r '.failed // 0')"
            if [ "$FAILED" != "0" ]; then
              echo "Cleanup had $FAILED failure(s)."
              exit 1
            fi
            if [ "$REMAINING" = "0" ]; then
              echo "Cleanup complete."
              exit 0
            fi
            sleep 2
          done
          echo "Cleanup did not finish within the allowed batches."
          exit 1
