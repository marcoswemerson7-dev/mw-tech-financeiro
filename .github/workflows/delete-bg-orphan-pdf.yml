name: Delete orphan BG PDF

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/delete-bg-orphan-pdf.yml"

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete orphan PDF from Supabase Storage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://jfzavijlkbqzkrnlgphz.supabase.co/functions/v1/delete-orphan-vencedores-469167"
